name: Deploy site

# Rebuild exports from existing data and publish. No fetching, no
# classification. Runs on pushes that change export code or the data (hand
# edits publish without waiting for the next cron), and on demand.

on:
  push:
    branches: [main]
    paths:
      - "pipeline/build_exports.py"
      - "pipeline/build_pages.py"
      - "content/**"
      - "data/**"
      - "site/**"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build exports
        run: |
          python pipeline/validate_data.py || { python pipeline/quarantine.py && python pipeline/validate_data.py; }
          python pipeline/build_exports.py
      - name: Commit rebuilt exports
        run: |
          git config user.name "underincarcerated-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site data/offenders.csv
          git diff --cached --quiet || git commit -m "Rebuild exports"
          git pull --rebase --autostash origin main
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
