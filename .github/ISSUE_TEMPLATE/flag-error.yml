name: Flag an error in a record
description: Report a record that is wrong, doesn't belong, or duplicates another.
title: "[Error report] "
labels: ["feedback", "error-report"]
body:
  - type: input
    id: record-id
    attributes:
      label: Record ID
      description: The id of the record (visible in the CSV download), or describe the row.
      placeholder: "e.g. 412, or '2026-07-11 Springfield OH robbery'"
    validations:
      required: true
  - type: dropdown
    id: problem-type
    attributes:
      label: What's wrong?
      options:
        - Shouldn't be included (no concrete prior record or release status)
        - Factual error (wrong date, location, offense, counts, or release status)
        - Duplicate of another record
        - Same person as another record but not linked
        - Source link is dead or doesn't support the claim
        - Other
    validations:
      required: true
  - type: textarea
    id: explanation
    attributes:
      label: Explain the problem
      description: What specifically is wrong, and how do you know?
    validations:
      required: true
  - type: input
    id: evidence-url
    attributes:
      label: Supporting link (optional)
